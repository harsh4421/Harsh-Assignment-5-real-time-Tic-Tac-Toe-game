<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grid Clash</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><header><div><span class="eyebrow">REAL-TIME ARCADE</span><h1>GRID CLASH</h1><p>Two players. One board. Zero excuses.</p></div><div id="connection" class="pill">● Connecting</div></header><section class="setup" id="setup"><input id="name" placeholder="Your name" maxlength="30"><input id="room" placeholder="Room code e.g. ROOM42" maxlength="40"><button id="join">Enter Arena</button></section><section id="game" class="hidden"><div class="topbar"><div><small>ROOM</small><strong id="roomLabel"></strong></div><div id="status"></div><button id="reset">New Round</button></div><div class="players"><div id="playerX" class="player"><span>X</span><div><small>PLAYER X</small><strong>Waiting...</strong></div></div><div id="playerO" class="player"><span>O</span><div><small>PLAYER O</small><strong>Waiting...</strong></div></div></div><div id="board" class="board"></div><p class="hint">Share the room code with your opponent.</p></section><section class="history"><div class="section-title"><span class="eyebrow">MATCH LOG</span><h2>Recent Battles</h2></div><div id="historyList">Loading history...</div></section></main><script src="/socket.io/socket.io.js"></script><script src="/script.js"></script></body></html>
